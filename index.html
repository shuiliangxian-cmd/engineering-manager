<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程项目管理台账</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f4f7fa; color: #172d34; font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif }
header { background: #122e35; color: white; padding: 36px max(24px, calc((100% - 1140px)/2)) 64px }
header p { color: #b8d8d6; margin: 6px 0 0 }
h1, h2, p { margin: 0 }
h1 { font-size: clamp(25px, 4vw, 36px) }
h2 { font-size: 20px }
main { max-width: 1188px; margin: -32px auto 0; padding: 0 24px 40px }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 16px; margin-bottom: 24px }
.card, section, dialog { background: white; border: 1px solid #dae5e9; border-radius: 16px; box-shadow: 0 8px 24px #14313a0a }
.card { padding: 19px 23px; color: #49636b }
.card strong { display: block; color: #174b48; font-size: 29px; overflow-wrap: anywhere }
.toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 20px 24px }
button { cursor: pointer; font: inherit; padding: 7px 13px; border: 1px solid #ccdce0; background: white; border-radius: 8px; color: #24464d }
button:hover { background: #edf5f5 }
.primary { background: #087568; border-color: #087568; color: white }
.primary:hover { background: #065b52 }
.danger { color: #a12336 }
.table-wrap { overflow-x: auto }
table { width: 100%; min-width: 790px; border-collapse: collapse; text-align: left }
th, td { padding: 14px 12px; border-top: 1px solid #e5edf0 }
th:first-child, td:first-child { padding-left: 24px }
th { background: #f5f8fa; color: #49636b; font-size: 13px; white-space: nowrap }
td:first-child { font-weight: 600; overflow-wrap: anywhere; max-width: 240px }
td:last-child { white-space: nowrap }
td button { padding: 4px 8px; margin-right: 4px }
progress { width: 90px; height: 9px; accent-color: #087568; vertical-align: middle; margin-right: 8px }
dialog { width: min(460px, calc(100% - 32px)); padding: 24px }
dialog::backdrop { background: #112d39a0 }
label { display: grid; gap: 4px; margin-top: 12px }
input { font: inherit; color: inherit; padding: 8px 10px; width: 100%; border: 1px solid #adbec6; border-radius: 8px }
.filters { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; padding: 0 24px 16px }
.filters label { margin: 0; color: #49636b; font-size: 13px }
.filters select { font: inherit; color: #24464d; padding: 8px 10px; background: white; border: 1px solid #adbec6; border-radius: 8px }
.overdue { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: #fde9ed; color: #a12336; font-size: 12px; white-space: nowrap }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px }
#empty { padding: 32px 24px; text-align: center; color: #49636b }
#notice { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; background: #fff4d4; color: #64460d; white-space: pre-wrap; overflow-wrap: anywhere }
.hint { color: #49636b; font-size: 13px; margin-top: 12px }
.account { padding: 20px 24px; margin-bottom: 18px }
#ai-report { white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f8fa; padding: 14px; border-radius: 8px }
#ai-panel { width: min(720px, calc(100% - 32px)); max-height: 85vh }
[hidden] { display: none !important }
</style>
</head>
<body>
<header>
  <h1>工程项目管理台账</h1>
  <p>查看项目投资、负责人和完工进度</p>
</header>
<main>
  <section class="account" aria-labelledby="account-title">
    <h2 id="account-title">云端账号</h2>
    <p id="auth-message" role="status">正在初始化登录…</p>
    <form id="auth-form" hidden>
      <label>邮箱<input name="email" type="email" autocomplete="email" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="actions">
        <button name="mode" value="login" type="submit" class="primary">登录</button>
        <button name="mode" value="signup" type="submit">注册</button>
      </div>
    </form>
    <button id="logout" type="button" hidden>退出登录</button>
  </section>
  <div id="ledger" hidden>
  <div class="stats" aria-label="项目概览">
    <div class="card">项目总数<strong id="count">0</strong></div>
    <div class="card">总投资（万元）<strong id="investment">0</strong></div>
    <div class="card">进行中<strong id="active">0</strong></div>
  </div>
  <p id="notice" role="alert" hidden></p>
  <section aria-labelledby="list-title">
    <div class="toolbar">
      <h2 id="list-title">项目列表</h2>
      <div>
        <button id="reload" type="button">刷新列表</button>
        <button id="ai-open" type="button">AI 分析中心</button>
        <button id="add" class="primary" type="button">＋ 新增项目</button>
      </div>
    </div>
    <div class="filters">
      <label>搜索项目名称<input id="search" type="search" placeholder="输入项目名称"></label>
      <label>项目状态<select id="status">
        <option value="all">全部</option>
        <option value="active">进行中</option>
        <option value="completed">已完成</option>
      </select></label>
      <button id="export" type="button">导出当前列表 CSV</button>
    </div>
    <div class="table-wrap" id="table-wrap" tabindex="0" aria-label="项目明细">
      <table>
        <thead><tr><th>项目名称</th><th>投资金额（万元）</th><th>负责人</th><th>计划完成日期</th><th>完成进度</th><th>操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>暂无项目，点击「新增项目」录入第一条记录。</p>
  </section>
  <p class="hint">项目保存在当前登录账号的云端台账中。进度为 1% 至 99% 的项目计为进行中。</p>
  </div>
</main>
<dialog id="ai-panel" aria-labelledby="ai-title">
  <h2 id="ai-title">AI 分析中心</h2>
  <p class="hint">分析会将项目名称、投资金额、负责人、计划完成日期和进度发送给 OpenAI。单次最多 20 项，每账号每日最多 5 次。</p>
  <label>当前项目<select id="ai-project"></select></label>
  <div class="actions">
    <button id="ai-single" type="button" class="primary">分析当前项目</button>
    <button id="ai-all" type="button">分析全部项目</button>
    <button id="ai-close" type="button">关闭</button>
  </div>
  <p id="ai-status" role="status"></p>
  <p id="ai-report" hidden></p>
  <div class="actions" id="ai-tools" hidden>
    <button id="ai-copy" type="button">复制报告</button>
    <button id="ai-export" type="button">导出报告</button>
  </div>
</dialog>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="form">
    <h2 id="editor-title">新增项目</h2>
    <label>项目名称<input name="name" maxlength="120" required autofocus></label>
    <label>投资金额（万元）<input name="amount" type="number" min="0" max="9999999999.99" step="0.01" required></label>
    <label>负责人<input name="owner" maxlength="60" required></label>
    <label>计划完成日期<input name="date" type="date" required></label>
    <label>完成进度（%）<input name="progress" type="number" min="0" max="100" step="1" required></label>
    <p id="form-error" role="alert" class="danger"></p>
    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button class="primary" type="submit">保存项目</button>
    </div>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";

const byId = id => document.getElementById(id);
const formatter = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 });
const editor = byId("editor");
const form = byId("form");
const fields = form.elements;
let projects = [];
let editingId = null;
let client;
let user;
let accountVersion = 0;
let busy = false;
const projectColumns = "id,name,investment,manager,deadline,progress";

function showNotice(message) {
  byId("notice").textContent = message;
  byId("notice").hidden = !message;
}

function projectReadDiagnostic(error, status) {
  const code = error?.code;
  const advice = {
    "42501": "检查 authenticated 角色的 SELECT 授权和当前用户适用的 RLS 策略。",
    "42703": "检查返回信息中提到的字段是否存在于 public.projects。",
    "PGRST204": "检查字段名称，以及 API 是否识别当前表结构。",
    "PGRST205": "检查当前 Supabase 项目中的 public.projects 是否存在并可通过 Data API 访问。",
    "42P01": "检查当前 Supabase 项目中的 public.projects 是否存在。",
    "PGRST301": "请退出后重新登录，再刷新列表。",
    "PGRST303": "请退出后重新登录，再刷新列表。"
  };
  const next = (Object.hasOwn(advice, code) ? advice[code] : "") || (
    status === 0 || error?.name === "TypeError" ? "浏览器未收到 HTTP 响应。请在「网络」面板查看请求是否被拦截或连接失败。" :
    status === 401 ? "请重新登录，并确认项目地址与 Publishable key 来自同一个 Supabase 项目。" : ""
  );
  return [
    "请求：读取 public.projects",
    `HTTP 状态：${status === 0 ? "未收到响应" : status ?? "未知"} · 错误代码：${code || "未提供"}`,
    "错误描述：" + (error?.message || "未提供"),
    error?.details && "详情：" + error.details,
    error?.hint && "Supabase 提示：" + error.hint,
    next
  ].filter(Boolean).join("\n");
}

function reportProjectReadFailure(title, failure) {
  const diagnostic = projectReadDiagnostic(failure.cause ?? failure, failure.status);
  showNotice(title + "\n" + diagnostic);
  console.warn("[工程台账] " + diagnostic);
}

async function loadProjects(version) {
  const accountId = user.id;
  const result = [];
  const batch = 100;
  for (let offset = 0; ; offset += batch) {
    const { data, error, status } = await client.from("projects").select(projectColumns)
      .eq("user_id", accountId).order("created_at", { ascending: false })
      .order("id").range(offset, offset + batch - 1);
    if (version !== accountVersion) return;
    if (error) {
      throw Object.assign(new Error("读取项目失败", { cause: error }), { status });
    }
    result.push(...data);
    if (data.length < batch) break;
  }
  projects = result.map(row => ({
    id: row.id, name: row.name, amount: Number(row.investment),
    owner: row.manager, date: row.deadline, progress: Number(row.progress)
  }));
  render();
}

async function refresh() {
  if (!user || busy) return;
  const version = accountVersion;
  setBusy(true);
  showNotice("");
  try {
    await loadProjects(version);
  } catch (error) {
    if (version === accountVersion) reportProjectReadFailure("无法读取云端项目。", error);
  } finally {
    if (version === accountVersion) setBusy(false);
  }
}

function setBusy(value) {
  busy = value;
  for (const id of ["add", "reload"]) byId(id).disabled = value;
  form.querySelector('[type="submit"]').disabled = value;
}

async function changeProjects(request, closeEditor = false) {
  if (!user || busy) return;
  const version = accountVersion;
  const accountId = user.id;
  setBusy(true);
  showNotice("");
  try {
    const { data, error } = await request(accountId).select("id");
    if (version !== accountVersion) return;
    if (error) throw error;
    if (data.length !== 1) {
      throw new Error("Project no longer available");
    }
    if (closeEditor) editor.close();
    try {
      await loadProjects(version);
    } catch (error) {
      if (version === accountVersion) {
        reportProjectReadFailure("修改已保存，但列表刷新失败。请点击「刷新列表」。", error);
      }
    }
  } catch {
    if (version !== accountVersion) return;
    const message = "未能确认操作结果。请检查网络和权限，刷新列表后再决定是否重试。";
    showNotice(message);
    if (editor.open) byId("form-error").textContent = message;
  } finally {
    if (version === accountVersion) setBusy(false);
  }
}

function action(label, handler, destructive = false) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  if (destructive) button.className = "danger";
  button.addEventListener("click", handler);
  return button;
}

function isActive(project) {
  return project.progress > 0 && project.progress < 100;
}

function localDate() {
  const now = new Date();
  return [now.getFullYear(), now.getMonth() + 1, now.getDate()]
    .map(value => String(value).padStart(2, "0")).join("-");
}

function isOverdue(project, today) {
  return project.progress < 100 && project.date < today;
}

function visibleProjects() {
  const query = byId("search").value.trim().toLowerCase();
  const status = byId("status").value;
  return projects.filter(project => project.name.toLowerCase().includes(query) && (
    status === "all" || (status === "active" ? isActive(project) : project.progress === 100)
  ));
}

function exportCsv() {
  const today = localDate();
  const rows = [["项目名称", "投资金额（万元）", "负责人", "计划完成日期", "完成进度", "逾期提醒"]];
  for (const project of visibleProjects()) {
    rows.push([project.name, project.amount, project.owner, project.date,
      project.progress + "%", isOverdue(project, today) ? "已逾期" : ""]);
  }
  const csv = rows.map(row => row.map(value => {
    let field = String(value);
    // Keep formula-like text as text when Excel opens the CSV.
    if (/^\s*[=+@-]/.test(field)) field = "'" + field;
    return '"' + field.replaceAll('"', '""') + '"';
  }).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "工程项目管理台账-" + today + ".csv";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function render() {
  byId("count").textContent = projects.length;
  const total = projects.reduce((sum, project) => sum + Math.round(project.amount * 100), 0);
  byId("investment").textContent = formatter.format(total / 100);
  byId("active").textContent = projects.filter(isActive).length;
  const visible = visibleProjects();
  byId("empty").hidden = visible.length > 0;
  byId("empty").textContent = projects.length ? "没有符合当前搜索和筛选条件的项目。" : "暂无项目，点击「新增项目」录入第一条记录。";
  byId("table-wrap").hidden = visible.length === 0;
  byId("export").disabled = visible.length === 0;
  const today = localDate();
  const rows = byId("rows");
  rows.replaceChildren();
  for (const project of visible) {
    const row = rows.insertRow();
    for (const value of [project.name, formatter.format(project.amount), project.owner]) {
      row.insertCell().textContent = value;
    }
    const dateCell = row.insertCell();
    dateCell.textContent = project.date;
    if (isOverdue(project, today)) {
      const badge = document.createElement("span");
      badge.className = "overdue";
      badge.textContent = "已逾期";
      dateCell.append(badge);
    }
    const bar = document.createElement("progress");
    bar.max = 100;
    bar.value = project.progress;
    bar.setAttribute("aria-label", project.name + "的完成进度");
    row.insertCell().append(bar, project.progress + "%");
    row.insertCell().append(
      action("编辑", () => openEditor(project)),
      action("AI 分析", () => openAnalysis(project.id)),
      action("删除", () => {
        if (!busy && confirm("确定删除「" + project.name + "」？")) {
          changeProjects(id => client.from("projects").delete().eq("user_id", id).eq("id", project.id));
        }
      }, true)
    );
  }
}

function openEditor(project) {
  if (!user || busy) return;
  editingId = project?.id ?? null;
  form.reset();
  byId("form-error").textContent = "";
  byId("editor-title").textContent = project ? "编辑项目" : "新增项目";
  for (const name of ["name", "amount", "owner", "date", "progress"]) {
    fields.namedItem(name).value = project?.[name] ?? (name === "progress" ? 0 : "");
  }
  editor.showModal();
}

byId("search").addEventListener("input", render);
byId("status").addEventListener("change", render);
byId("export").addEventListener("click", exportCsv);
byId("add").addEventListener("click", () => openEditor());
byId("reload").addEventListener("click", refresh);
byId("cancel").addEventListener("click", () => editor.close());
form.addEventListener("submit", event => {
  event.preventDefault();
  const data = new FormData(form);
  const name = data.get("name").trim();
  const owner = data.get("owner").trim();
  if (!name || !owner) {
    byId("form-error").textContent = "请输入项目名称和负责人。";
    fields.namedItem(!name ? "name" : "owner").focus();
    return;
  }
  const values = {
    name, manager: owner, investment: Number(data.get("amount")),
    deadline: data.get("date"), progress: Number(data.get("progress"))
  };
  const projectId = editingId;
  changeProjects(id => projectId
    ? client.from("projects").update(values).eq("user_id", id).eq("id", projectId)
    : client.from("projects").insert({ ...values, user_id: id }), true);
});

const authForm = byId("auth-form");
const authMessage = byId("auth-message");
let authReady = false;
let refreshTimer;

const aiPanel = byId("ai-panel");
const aiPicker = byId("ai-project");
const aiStatus = byId("ai-status");
const aiReport = byId("ai-report");
let analyzing = false;
let analysisController;

function syncAnalysisButtons() {
  byId("ai-single").disabled = analyzing || !aiPicker.value;
  byId("ai-all").disabled = analyzing;
}

function showReport(text) {
  aiReport.textContent = text;
  aiReport.hidden = !text;
  byId("ai-tools").hidden = !text;
}

function openAnalysis(projectId) {
  if (!user) return;
  aiPicker.replaceChildren();
  for (const project of projects) {
    const option = document.createElement("option");
    option.value = project.id;
    option.textContent = project.name;
    aiPicker.append(option);
  }
  if (projectId) aiPicker.value = projectId;
  syncAnalysisButtons();
  if (!aiPanel.open) aiPanel.showModal();
}

async function analyze(scope) {
  if (!user || analyzing || (scope === "single" && !aiPicker.value)) return;
  const version = accountVersion;
  const controller = new AbortController();
  analysisController = controller;
  analyzing = true;
  syncAnalysisButtons();
  showReport("");
  aiStatus.textContent = "正在生成分析报告，请稍候…";
  const messages = {
    LOGIN: "登录已失效，请重新登录后重试。",
    EMPTY: "没有可分析的项目，请刷新台账后重试。",
    TOO_MANY: "全部项目超过 20 项，请选择单个项目分析。",
    RATE: "今天的 5 次分析额度已用完，额度在北京时间每天 08:00 重置。",
    QUOTA: "OpenAI 余额或额度不足，请联系管理员检查账单和用量。",
    UPSTREAM_RATE: "AI 服务当前请求过多，请稍后重试。",
    SETUP: "AI 分析尚未配置，请联系管理员。",
    RATE_SETUP: "分析次数限制尚未配置，请联系管理员。"
  };
  try {
    const body = scope === "single" ? { scope, projectId: aiPicker.value } : { scope };
    const { data, error } = await client.functions.invoke("analyze-projects", { body, signal: controller.signal });
    if (version !== accountVersion) return;
    if (error) {
      const payload = await error.context?.json?.().catch(() => null);
      if (version !== accountVersion) return;
      const code = payload?.code ?? (error.context?.status === 401 ? "LOGIN" : "");
      aiStatus.textContent = Object.hasOwn(messages, code) ? messages[code] : "分析失败，请稍后重新点击分析。";
      return;
    }
    const lines = [
      "工程项目 AI 分析报告",
      `分析日期 ${data.today}（北京时间）｜覆盖 ${data.count} 个项目`,
      data.overdue.length ? "已逾期且未完成：" + data.overdue.join("、") : "未发现按现有字段可确认的逾期项目。",
      "台账缺少计划进度、进度统计日期和关键节点，无法准确判断实际进度是否落后于计划。",
      ...data.sections.map(section => section.title + "\n" + section.text)
    ];
    showReport(lines.join("\n\n"));
    aiStatus.textContent = "报告已生成。";
  } catch {
    if (version === accountVersion) aiStatus.textContent = "分析失败，请稍后重新点击分析。";
  } finally {
    if (version === accountVersion) {
      analysisController = undefined;
      analyzing = false;
      syncAnalysisButtons();
    }
  }
}

byId("ai-open").addEventListener("click", () => openAnalysis());
byId("ai-close").addEventListener("click", () => aiPanel.close());
aiPicker.addEventListener("change", syncAnalysisButtons);
byId("ai-single").addEventListener("click", () => analyze("single"));
byId("ai-all").addEventListener("click", () => analyze("all"));
byId("ai-copy").addEventListener("click", async () => {
  const version = accountVersion;
  try {
    await navigator.clipboard.writeText(aiReport.textContent);
    if (version === accountVersion) aiStatus.textContent = "已复制报告。";
  } catch {
    if (version === accountVersion) aiStatus.textContent = "复制失败，可以手动选中文本或导出报告。";
  }
});
byId("ai-export").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob(["\uFEFF", aiReport.textContent], { type: "text/plain;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "工程项目AI分析-" + localDate() + ".txt";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function applySession(session) {
  const next = session?.user;
  if (authReady && user?.id === next?.id) return;
  authReady = true;
  accountVersion += 1;
  analysisController?.abort();
  analysisController = undefined;
  analyzing = false;
  if (aiPanel.open) aiPanel.close();
  aiPicker.replaceChildren();
  showReport("");
  aiStatus.textContent = "";
  user = next;
  clearTimeout(refreshTimer);
  if (editor.open) editor.close();
  projects = [];
  byId("search").value = "";
  byId("status").value = "all";
  showNotice("");
  setBusy(false);
  render();
  byId("ledger").hidden = !user;
  byId("logout").hidden = !user;
  authForm.hidden = Boolean(user);
  authForm.reset();
  authMessage.textContent = user ? "当前账号 " + (user.email ?? "") : "请登录，或使用邮箱注册。";
  if (user) refreshTimer = setTimeout(refresh, 0);
}

authForm.addEventListener("submit", async event => {
  event.preventDefault();
  const signup = event.submitter?.value === "signup";
  const fields = new FormData(authForm);
  const email = fields.get("email").trim();
  const password = fields.get("password");
  const buttons = authForm.querySelectorAll("button");
  buttons.forEach(button => { button.disabled = true; });
  authMessage.textContent = signup ? "正在提交注册…" : "正在登录…";
  try {
    const callback = location.origin + location.pathname;
    const { data, error } = signup
      ? await client.auth.signUp({ email, password, options: { emailRedirectTo: callback } })
      : await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (data.session) {
      applySession(data.session);
    } else if (signup) {
      authForm.elements.namedItem("password").value = "";
      authMessage.textContent = "如果该邮箱可注册，请查收验证邮件。在注册时使用的浏览器中打开链接，再返回登录。";
    }
  } catch (error) {
    authMessage.textContent = ({
      email_not_confirmed: "邮箱尚未验证，请先打开验证邮件。",
      invalid_credentials: "邮箱或密码不正确。",
      signup_disabled: "项目未启用邮箱注册。",
      weak_password: "密码不符合要求，请使用更强的密码。",
      over_email_send_rate_limit: "邮件发送过于频繁，请稍后重试。"
    })[error.code] ?? (signup ? "注册失败，请检查网络和邮箱认证设置。" : "登录失败，请检查网络后重试。");
  } finally {
    buttons.forEach(button => { button.disabled = false; });
  }
});

byId("logout").addEventListener("click", async event => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    const { error } = await client.auth.signOut({ scope: "local" });
    if (error) throw error;
    applySession(null);
  } catch {
    authMessage.textContent = "退出操作未完成，请刷新页面确认登录状态。";
  } finally {
    button.disabled = false;
  }
});

function start() {
  const config = window.SUPABASE_CONFIG;
  if (!config?.publishableKey?.startsWith("sb_publishable_")) {
    authMessage.textContent = "请在 config.js 填写 sb_publishable_ 开头的 Publishable key。";
    return;
  }
  if (!["http:", "https:"].includes(location.protocol)) {
    authMessage.textContent = "请通过本地预览地址或 HTTPS 网站打开台账。";
    return;
  }
  if (!window.supabase) {
    authMessage.textContent = "无法加载 Supabase 登录组件，请检查网络后刷新。";
    return;
  }
  try {
    client = window.supabase.createClient(config.projectUrl, config.publishableKey, {
      auth: { flowType: "pkce" }
    });
    const callbackParams = new URLSearchParams(location.search);
    const callbackFailed = callbackParams.has("error") ||
      new URLSearchParams(location.hash.slice(1)).has("error");
    client.auth.onAuthStateChange((event, session) => {
      applySession(session);
      if (event === "INITIAL_SESSION" && !session &&
          (callbackFailed || callbackParams.has("code"))) {
        authMessage.textContent = "验证链接未能建立登录会话。请尝试用已验证的邮箱登录，或检查链接是否过期及浏览器是否相同。";
      }
    });
  } catch {
    authMessage.textContent = "连接设置无效，请检查 config.js 中的项目地址和 Publishable key。";
  }
}
start();
</script>
